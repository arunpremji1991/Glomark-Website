name: Build and deploy to Hostinger

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab in GitHub (useful for the first run, or to
# redeploy without a new commit).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # Uploads everything in ./out (the built site) to Hostinger over FTP.
      # Credentials come from GitHub repository secrets — never stored in
      # this file or visible in logs.
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./public_html/
